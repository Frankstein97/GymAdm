<!doctype html>
<html lang="es">
  <head><meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1" /><title>Usuarios por roles - GymAdm</title><link rel="stylesheet" href="admin.css" /></head>
  <body>
    <main class="admin-page">
      <header class="topbar">
        <div class="brand"><div class="logo">GA</div><div><h1>GymAdm</h1><p>Acceso administración.</p></div></div>
        <button class="hamburger" id="hamburger">☰</button>
        <div class="menu-panel" id="menu-panel"><nav class="nav"><a href="admin-dashboard.html">Dashboard general</a><a class="active" href="admin-users.html">Usuarios por roles</a><a href="admin-calendar.html">Calendario</a><a href="admin-classes.html">Clases y horarios</a></nav><div class="userbox"><span id="admin-user-name">Admin</span><a href="index.html" id="logout">↩</a></div></div>
      </header>
      <section class="content-card">
        <h2>Usuarios (CRUD local)</h2>
        <form id="user-form" class="inline-form">
          <input id="user-id" placeholder="DNI" required />
          <input id="user-name" placeholder="Nombre" required />
          <select id="user-role"><option>alumno</option><option>profe</option><option>admin</option></select>
          <button type="submit">Guardar</button>
        </form>
        <table class="table" id="users-table"><thead><tr><th>DNI</th><th>Nombre</th><th>Rol</th><th>Acciones</th></tr></thead><tbody></tbody></table>
      </section>
    </main>
    <script src="app-data.js"></script><script src="admin-common.js"></script><script src="admin-users.js"></script>
  </body>
</html>
